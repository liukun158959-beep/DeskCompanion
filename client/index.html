<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>凯尔希</title>
    <script src="/Core/live2dcubismcore.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #dock, #chat {
        position: absolute;
        left: 12px;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #f4f1ea;
      }
      #dock {
        top: 12px;
        display: flex;
        gap: 8px;
        z-index: 2;
      }
      #dock button, #close-chat, #send {
        border: 1px solid rgba(255, 176, 92, 0.7);
        background: rgba(18, 20, 24, 0.88);
        color: #ffb05c;
        border-radius: 2px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #chat {
        top: 48px;
        width: 440px;
        box-sizing: border-box;
        background: rgba(12, 14, 18, 0.92);
        border: 1px solid rgba(255, 176, 92, 0.45);
        padding: 12px;
        font-size: 14px;
        line-height: 1.6;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      #chat.hidden { display: none; }
      #chat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      #reply {
        min-height: 56px;
        max-height: 380px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
        margin-bottom: 10px;
        padding: 8px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 8px;
      }
      #status { min-height: 18px; font-size: 12px; color: #c8c2b4; font-style: italic; margin-bottom: 8px; }
      #bar { display: flex; gap: 8px; }
      #msg { flex: 1; border: 1px solid rgba(255, 176, 92, 0.35); border-radius: 2px; padding: 8px; font-size: 14px; background: transparent; color: #f4f1ea; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="dock">
      <button id="toggle-chat" type="button">对话</button>
      <button id="hide-pet" type="button">隐藏桌宠</button>
    </div>
    <div id="chat">
      <div id="chat-head">
        <span>凯尔希</span>
        <button id="close-chat" type="button">收起对话</button>
      </div>
      <div id="reply">跟凯尔希说点什么…</div>
      <div id="status"></div>
      <div id="bar">
        <input id="msg" placeholder="回车发送" />
        <button id="send">发送</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
