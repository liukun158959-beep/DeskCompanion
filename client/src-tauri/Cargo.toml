[package]
name = "desk-companion-client"
version = "0.2.2"
description = "DeskCompanion Windows desktop client"
edition = "2021"

[lib]
name = "desk_companion_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
