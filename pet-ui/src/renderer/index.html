<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>凯尔希</title>
    <script src="./Core/live2dcubismcore.js"></script>
    <script src="./vendor/marked.min.js"></script>
    <script src="./vendor/purify.min.js"></script>
  </head>
  <body>
    <div id="stage">
      <aside id="bubble" hidden>
        <div class="shell">
          <div class="tail" aria-hidden="true"></div>
          <header>
            <nav class="tabs" id="tabs">
              <button type="button" data-panel="today">今日</button>
              <button type="button" data-panel="maa">方舟</button>
              <button type="button" data-panel="chat">对话</button>
            </nav>
            <div class="actions">
              <button class="clear" id="clear" type="button">清空</button>
              <button class="close" id="close" type="button">关闭</button>
            </div>
          </header>
          <div id="panel-today" class="panel">
            <p class="banner" id="today-banner" hidden></p>
            <div class="focus" id="today-focus"></div>
            <ul class="rest" id="today-rest"></ul>
            <button class="text-btn" id="today-refresh" type="button">刷新</button>
          </div>
          <div id="panel-maa" class="panel" hidden>
            <p class="maa-status" id="maa-status"></p>
            <p class="maa-note">清日常会更新仓库，不是第 9 个勾选。八项都不勾也仍会扫仓。</p>
            <ul class="maa-opts" id="maa-opts"></ul>
            <div class="maa-actions">
              <button type="button" id="maa-open">打开游戏</button>
              <button type="button" id="maa-start">开始</button>
              <button type="button" id="maa-stop">停止</button>
            </div>
          </div>
          <div id="panel-chat" class="panel" hidden>
            <div id="log"></div>
          </div>
          <div id="footer">
            <div id="chat-bar">
              <input id="input" type="text" autocomplete="off" placeholder="跟凯尔希说…" />
            </div>
            <p class="hint">回车发送 · Esc 关闭</p>
          </div>
        </div>
      </aside>
      <div id="canvas-wrap">
        <canvas id="live2d"></canvas>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
