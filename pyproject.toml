[project]
name = "desk-companion"
version = "0.2.2"
description = "知行个人 Agent 工作台：对话、记忆、任务与协作"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "pywin32>=306",
    "pywebview>=5.0",
    "pystray>=0.19",
    "huggingface_hub>=0.23",
    "sentence-transformers>=3.0",
    "yt-dlp==2026.8.19",
    "yt-dlp-ejs==0.8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["desk_companion*"]

[tool.setuptools.package-data]
desk_companion = ["ui/*"]
